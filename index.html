<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Dashboard Project</title>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <img src="icons/view-dashboard.svg" alt="dashboard icon">
                <h1>Dashboard</h1>
            </div>
            <div class="sidebar-navigation">
                <img src="icons/home.svg" alt="home icon">
                <a href="">Home</a>
                <img src="icons/card-account-details.svg" alt="profile icon">
                <a href="">Profile</a>
                <img src="icons/message.svg" alt="message icon">
                <a href="">Messages</a>
                <img src="icons/clock-time-three.svg" alt="history icon">
                <a href="">History</a>
                <img src="icons/note-multiple.svg" alt="task icon">
                <a href="">Tasks</a>
                <img src="icons/account-group.svg" alt="communities icon">
                <a href="">Communities</a>
            </div>
            <div class="support-navigation">
                <img src="icons/cog.svg" alt="settings icon">
                <a href="">Settings</a>
                <img src="icons/help-box.svg" alt="support icon">
                <a href="">Support</a>
                <img src="icons/lock.svg" alt="privacy icon">
                <a href="">Privacy</a>
            </div>
        </div>
        <div class="header">

        </div>
        <div class="main-content">

        </div>
